    <style>
        /* Estilos para piezas dañadas en el SVG */
        .damaged-piece {
            transition: all 0.3s ease !important;
        }

        .damaged-piece:hover {
            opacity: 0.8 !important;
            filter: brightness(1.1) !important;
        }

        /* Estilos para diferentes tipos de daño */
        .damage-good {
            fill: #2ecc71 !important;
            stroke: #27ae60 !important;
        }

        .damage-scratched {
            fill: #f39c12 !important;
            stroke: #e67e22 !important;
        }

        .damage-chipped {
            fill: #0097c6 !important;
            stroke: #0782a8 !important;
        }

        .damage-dented {
            fill: #e74c3c !important;
            stroke: #c0392b !important;
        }

        .damage-faded {
            fill: #9b59b6 !important;
            stroke: #8e44ad !important;
        }

        .damage-other {
            fill: #95a5a6 !important;
            stroke: #7f8c8d !important;
        }

        /* Estilos hover para el SVG */
        svg > a > g:hover path,
        svg > a > g:hover ellipse,
        svg > a > g:hover circle,
        svg > a > g:hover rect {
            fill: #d4e9f7 !important;
            stroke: #0097c6 !important;
            stroke-width: 2px !important;
            transition: all 0.3s ease !important;
        }
    </style>

    <script>
        // Mapeo de colores para cada tipo de daño
        const damageColors = {
            'Buen estado': {
                fill: '#2ecc71',      // Verde claro para relleno
                stroke: '#27ae60',    // Verde más oscuro para borde
                opacity: '0.7'        // Transparencia para que se vea bien
            },
            'Rayado': {
                fill: '#f39c12',      // Naranja para relleno
                stroke: '#e67e22',    // Naranja más oscuro para borde
                opacity: '0.8'
            },
            'Desportillado': {
                fill: '#0097c6',      // Azul para relleno
                stroke: '#0782a8',    // Azul más oscuro para borde
                opacity: '0.8'
            },
            'Abollado': {
                fill: '#e74c3c',      // Rojo para relleno
                stroke: '#c0392b',    // Rojo más oscuro para borde
                opacity: '0.8'
            },
            'Desgastado': {
                fill: '#9b59b6',      // Púrpura para relleno
                stroke: '#8e44ad',    // Púrpura más oscuro para borde
                opacity: '0.7'
            },
            'Otro': {
                fill: '#95a5a6',      // Gris para relleno
                stroke: '#7f8c8d',    // Gris más oscuro para borde
                opacity: '0.7'
            }
        };

        // Función para aplicar color a una pieza del SVG
        function applyDamageColor(pieceName, conditions) {
            // Convertir el nombre de la pieza a formato de ID del SVG
            const svgId = pieceName.replace(/\s+/g, '_').toUpperCase();

            // Buscar el elemento SVG por ID
            const svgElement = document.getElementById(svgId);

            if (svgElement) {
                // Determinar el color basado en la condición más severa
                let colorConfig = {
                    fill: 'white',
                    stroke: '#000000',
                    opacity: '1'
                };

                // Prioridad de severidad (de menos a más severo)
                const severityOrder = ['Buen estado', 'Desgastado', 'Otro', 'Desportillado', 'Rayado', 'Abollado'];

                let highestSeverity = -1;
                conditions.forEach(condition => {
                    const severity = severityOrder.indexOf(condition);
                    if (severity > highestSeverity) {
                        highestSeverity = severity;
                        colorConfig = damageColors[condition] || {
                            fill: '#95a5a6',
                            stroke: '#7f8c8d',
                            opacity: '0.7'
                        };
                    }
                });

                // Aplicar el color a todos los elementos path, ellipse, circle, rect dentro del grupo
                const pathElements = svgElement.querySelectorAll('path, ellipse, circle, rect');
                pathElements.forEach(element => {
                    // Aplicar relleno con color vibrante
                    element.style.fill = colorConfig.fill;
                    element.style.fillOpacity = colorConfig.opacity;
                    
                    // Aplicar borde más ancho y visible
                    element.style.stroke = colorConfig.stroke;
                    element.style.strokeWidth = '4px'; // Borde más ancho para mejor visibilidad
                    element.style.strokeOpacity = '1';
                    
                    // Agregar efecto de sombra para mayor impacto visual
                    element.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.3))';
                    
                    // Agregar clase para identificar piezas dañadas
                    element.classList.add('damaged-piece');
                    element.setAttribute('data-damage-type', conditions.join(', '));
                    
                    // Agregar transición suave
                    element.style.transition = 'all 0.3s ease';
                });

                console.log(`Color aplicado a ${pieceName}: ${colorConfig.fill} con borde ${colorConfig.stroke} (${conditions.join(', ')})`);
            } else {
                console.warn(`No se encontró el elemento SVG con ID: ${svgId}`);
            }
        }

        // Función para restaurar el color original de una pieza
        function restorePieceColor(pieceName) {
            const svgId = pieceName.replace(/\s+/g, '_').toUpperCase();
            const svgElement = document.getElementById(svgId);

            if (svgElement) {
                const pathElements = svgElement.querySelectorAll('path, ellipse, circle, rect');
                pathElements.forEach(element => {
                    // Restaurar colores originales
                    element.style.fill = 'white';
                    element.style.fillOpacity = '1';
                    element.style.stroke = '#000000';
                    element.style.strokeWidth = '';
                    element.style.strokeOpacity = '1';
                    
                    // Remover efectos
                    element.style.filter = '';
                    element.style.transition = '';
                    
                    // Remover clases y atributos
                    element.classList.remove('damaged-piece');
                    element.removeAttribute('data-damage-type');
                });
            }
        }

        // Función para actualizar todos los colores del SVG basado en la tabla
        function updateAllSVGColors() {
            // Primero restaurar todos los colores
            const allSvgGroups = document.querySelectorAll('svg > a > g');
            allSvgGroups.forEach(group => {
                const pathElements = group.querySelectorAll('path, ellipse, circle, rect');
                pathElements.forEach(element => {
                    element.style.fill = 'white';
                    element.style.fillOpacity = '1';
                    element.style.stroke = '#000000';
                    element.style.strokeWidth = '';
                    element.style.strokeOpacity = '1';
                    element.style.filter = '';
                    element.style.transition = '';
                    element.classList.remove('damaged-piece');
                    element.removeAttribute('data-damage-type');
                });
            });

            // Luego aplicar colores basados en los datos de la tabla (si existe)
            if (typeof $ !== 'undefined' && $('#inspection-table').length > 0) {
                const table = $('#inspection-table').DataTable();
                if (table && table.rows) {
                    const data = table.rows().data();
                    
                    for (let i = 0; i < data.length; i++) {
                        const row = data[i];
                        const pieceName = row[0]; // Columna de Pieza
                        const conditionText = row[1]; // Columna de Estado
                        
                        if (conditionText && conditionText !== 'Sin estado') {
                            const conditions = conditionText.split(', ').map(c => c.trim());
                            applyDamageColor(pieceName, conditions);
                        }
                    }
                }
            }
        }

        // Función para enviar la selección del modal (compatible con inspection.html)
        function submitSelection() {
            // Obtener el título del modal (pieza)
            const piece = document.getElementById('modal-title')?.textContent;

            if (!piece) {
                console.warn('No se encontró el título del modal');
                return;
            }

            // Obtener los valores seleccionados de los checkboxes
            const checkedConditions = Array.from(
                document.querySelectorAll('input[name="condition"]:checked')
            ).map(checkbox => checkbox.value);

            // Combinar los valores de los checkboxes en un string
            const conditionText = checkedConditions.join(', ') || 'Sin estado';

            // Obtener las observaciones del textarea
            const observations = document.querySelector('.observations')?.value || 'Sin observaciones';

            // Si existe la tabla de inspección, agregar/actualizar la fila
            if (typeof $ !== 'undefined' && $('#inspection-table').length > 0) {
                const table = $('#inspection-table').DataTable();
                
                // Verificar si ya existe una entrada para esta pieza
                const existingRowIndex = table.rows().indexes().filter(function (index) {
                    return table.row(index).data()[0] === piece;
                });

                if (existingRowIndex.length > 0) {
                    // Actualizar la fila existente
                    const rowIndex = existingRowIndex[0];
                    table.row(rowIndex).data([
                        piece,
                        conditionText,
                        observations,
                        table.row(rowIndex).data()[3] || '', // Mantener foto existente
                        table.row(rowIndex).data()[4] || ''
                    ]).draw(false);
                } else {
                    // Agregar una nueva fila al DataTable
                    table.row.add([
                        piece,
                        conditionText,
                        observations,
                        '', // Columna de Foto
                        ''  // Columna oculta con datos de foto
                    ]).draw(false);
                }
            }

            // Aplicar color al SVG si hay condiciones seleccionadas
            if (checkedConditions.length > 0) {
                applyDamageColor(piece, checkedConditions);
            } else {
                restorePieceColor(piece);
            }

            // Mostrar mensaje de éxito si SweetAlert está disponible
            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    icon: 'success',
                    title: '¡Guardado!',
                    text: 'Selección guardada correctamente',
                    timer: 1500,
                    showConfirmButton: false,
                    toast: true,
                    position: 'top-end'
                });
            }

            // Cerrar el modal si existe la función
            if (typeof closeModal === 'function') {
                closeModal();
            }

            console.log(`Daño aplicado a ${piece}: ${conditionText}`);
        }

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Sistema de coloreo de daños inicializado para moto.html');
            
            // Actualizar colores si ya hay datos en la tabla
            setTimeout(updateAllSVGColors, 500);
        });
    </script>
